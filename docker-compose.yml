services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (app sends traces here)
      - "8888:8888"   # Collector metrics
    environment:
      - GALILEO_CONSOLE_URL=${GALILEO_CONSOLE_URL}
      - GALILEO_API_KEY=${GALILEO_API_KEY}
      - GALILEO_PROJECT=${GALILEO_PROJECT}
      - GALILEO_LOG_STREAM=${GALILEO_LOG_STREAM}

  service-b-ts:
    build: .
    container_name: service-b-ts
    ports:
      - "3000:3000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=otel-ts-collector-demo
      - USE_REAL_LLM=${USE_REAL_LLM:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=3000
    depends_on:
      - otel-collector

  service-a-python:
    build: ./python-service
    container_name: service-a-python
    ports:
      - "8000:8000"
    environment:
      - GALILEO_API_KEY=${GALILEO_API_KEY}
      - GALILEO_PROJECT=${GALILEO_PROJECT}
      - GALILEO_LOG_STREAM=${GALILEO_LOG_STREAM}
      - GALILEO_CONSOLE_URL=${GALILEO_CONSOLE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=python-langgraph-service
      - TS_SERVICE_URL=http://service-b-ts:3000
    depends_on:
      - otel-collector
      - service-b-ts
